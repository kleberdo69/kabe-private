<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KABE PRIVATE — Admin</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#050507;--panel:rgba(255,255,255,.045);--stroke:rgba(255,255,255,.09);--red:#ff2d3e;--red-deep:#a1121f;--text:#f4f4f7;--muted:#9a9aa8;--green:#2dd4a7;--radius:14px;--font:'Inter',sans-serif;--display:'Space Grotesk',sans-serif}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font)}
::selection{background:rgba(255,45,62,.35);color:#fff}
.wrap{max-width:700px;margin:0 auto;padding:30px 20px}
h1{font-family:var(--display);font-size:22px;margin-bottom:6px;background:linear-gradient(120deg,#fff,#ff6b75,#ff2d3e);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);font-size:12px;margin-bottom:28px;letter-spacing:1px}
.card{background:var(--panel);border:1px solid var(--stroke);border-radius:var(--radius);padding:22px;margin-bottom:20px;backdrop-filter:blur(16px)}
.card h2{font-family:var(--display);font-size:14px;font-weight:700;margin-bottom:14px;text-transform:uppercase;letter-spacing:1.4px;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
input,select{background:rgba(0,0,0,.5);border:1px solid var(--stroke);border-radius:10px;padding:10px 14px;color:var(--text);font:inherit;font-size:13px;outline:0;transition:border .2s}
input:focus{border-color:var(--red-deep)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:10px 18px;border-radius:10px;font-weight:700;font-size:12px;border:1px solid rgba(255,255,255,.12);background:linear-gradient(135deg,#c1121f,#8f0d18);color:#fff;cursor:pointer;text-transform:uppercase;letter-spacing:.8px;transition:all .2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 24px -8px rgba(255,45,62,.6)}
.btn-sm{min-height:34px;padding:7px 14px;font-size:11px;background:linear-gradient(180deg,#141416,#0c0c0e);color:var(--text)}
.btn-sm:hover{border-color:rgba(255,45,62,.5)}
.btn-danger{background:linear-gradient(135deg,#8f0d18,#5f0a12)}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:10px 12px;border-bottom:1px solid var(--stroke);color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:1.4px;font-weight:800}
td{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.04)}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:10px;font-weight:700;letter-spacing:.5px}
.badge.on{background:rgba(45,212,167,.12);color:var(--green);border:1px solid rgba(45,212,167,.3)}
.badge.off{background:rgba(255,45,62,.1);color:#ff6b75;border:1px solid rgba(255,45,62,.3)}
.toast{position:fixed;bottom:20px;right:20px;background:rgba(20,16,22,.95);border:1px solid var(--stroke);border-radius:12px;padding:14px 20px;font-size:13px;backdrop-filter:blur(16px);box-shadow:0 16px 40px -10px rgba(0,0,0,.8);z-index:999;animation:slideIn .3s ease;max-width:340px}
.toast.ok{border-color:rgba(45,212,167,.4)}
.toast.err{border-color:rgba(255,45,62,.4)}
@keyframes slideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:24px}
.copy{cursor:pointer;color:var(--red);font-weight:700}
.copy:hover{text-decoration:underline}
#loginPanel{max-width:380px;margin:120px auto}
#loginPanel .card{text-align:center}
#loginPanel input{width:100%;margin-bottom:12px}
#loginPanel .err{color:#ff6b75;font-size:12px;margin-top:8px;min-height:18px}
#adminPanel{display:none}
</style>
</head>
<body>

<div id="loginPanel">
  <div class="wrap" style="padding:0">
    <h1>KABE PRIVATE</h1>
    <div class="sub">Painel Admin — Acesso Restrito</div>
    <div class="card">
      <h2>Login</h2>
      <input id="adminPass" type="password" placeholder="Senha do admin">
      <button class="btn" id="loginBtn" type="button" style="width:100%">Entrar</button>
      <div class="err" id="loginErr"></div>
    </div>
  </div>
</div>

<div id="adminPanel">
  <div class="wrap">
    <h1>KABE PRIVATE</h1>
    <div class="sub">Painel Admin</div>

    <div class="card">
      <h2>Gerar Keys</h2>
      <div class="row">
        <input id="keyCount" type="number" value="1" min="1" max="50" style="width:80px">
        <button class="btn" id="genBtn" type="button">Gerar</button>
      </div>
      <div id="genResult" style="font-size:12px;color:var(--green);margin-top:8px"></div>
    </div>

    <div class="card">
      <h2>Keys</h2>
      <div id="keysList"></div>
    </div>

    <div class="card">
      <h2>Usuarios</h2>
      <div id="usersList"></div>
    </div>
  </div>
</div>

<script>
var adminToken = null;

function toast(msg, ok) {
  var t = document.createElement('div');
  t.className = 'toast ' + (ok ? 'ok' : 'err');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function() { t.remove(); }, 3000);
}

function adminFetch(url, opts) {
  opts = opts || {};
  opts.headers = opts.headers || {};
  opts.headers['X-Admin-Token'] = adminToken;
  return fetch(url, opts);
}

document.getElementById('loginBtn').addEventListener('click', function() {
  var pass = document.getElementById('adminPass').value;
  var err = document.getElementById('loginErr');
  if (!pass) { err.textContent = 'Digite a senha'; return; }
  fetch('/api/admin/login', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({password: pass})
  }).then(function(r) { return r.json(); }).then(function(d) {
    if (d.ok && d.token) {
      adminToken = d.token;
      document.getElementById('loginPanel').style.display = 'none';
      document.getElementById('adminPanel').style.display = 'block';
      loadKeys();
      loadUsers();
    } else {
      err.textContent = d.error || 'Erro ao autenticar';
    }
  }).catch(function() {
    err.textContent = 'Erro de conexao';
  });
});

document.getElementById('adminPass').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') document.getElementById('loginBtn').click();
});

function loadKeys() {
  adminFetch('/api/keys').then(function(r) { return r.json(); }).then(function(d) {
    var el = document.getElementById('keysList');
    if (!d.keys || !d.keys.length) { el.innerHTML = '<div class="empty">Nenhuma key</div>'; return; }
    var html = '<table><tr><th>Key</th><th>Status</th><th>Usada por</th><th></th></tr>';
    d.keys.forEach(function(k) {
      html += '<tr>';
      html += '<td><span class="copy" title="Copiar" onclick="navigator.clipboard.writeText(\'' + k.key + '\');toast(\'Copiado!\',1)">' + k.key + '</span></td>';
      html += '<td><span class="badge ' + (k.active ? 'on' : 'off') + '">' + (k.active ? 'Ativa' : 'Inativa') + '</span></td>';
      html += '<td>' + (k.usedBy || '-') + '</td>';
      html += '<td><button class="btn btn-sm" onclick="toggleKey(\'' + k.key + '\')">' + (k.active ? 'Desativar' : 'Ativar') + '</button> <button class="btn btn-sm btn-danger" onclick="deleteKey(\'' + k.key + '\')">Excluir</button></td>';
      html += '</tr>';
    });
    html += '</table>';
    el.innerHTML = html;
  }).catch(function() { document.getElementById('keysList').innerHTML = '<div class="empty">Erro ao carregar</div>'; });
}

function loadUsers() {
  adminFetch('/api/admin/users').then(function(r) { return r.json(); }).then(function(d) {
    var el = document.getElementById('usersList');
    if (!d.users || !d.users.length) { el.innerHTML = '<div class="empty">Nenhum usuario</div>'; return; }
    var html = '<table><tr><th>Usuario</th><th>Criado</th><th></th></tr>';
    d.users.forEach(function(u) {
      html += '<tr>';
      html += '<td>' + u.user + '</td>';
      html += '<td>' + new Date(u.created).toLocaleDateString('pt-BR') + '</td>';
      html += '<td><button class="btn btn-sm btn-danger" onclick="deleteUser(\'' + u.user + '\')">Excluir</button></td>';
      html += '</tr>';
    });
    html += '</table>';
    el.innerHTML = html;
  }).catch(function() { document.getElementById('usersList').innerHTML = '<div class="empty">Erro ao carregar</div>'; });
}

document.getElementById('genBtn').addEventListener('click', function() {
  var count = parseInt(document.getElementById('keyCount').value) || 1;
  adminFetch('/api/keys/generate', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({count: count}) })
    .then(function(r) { return r.json(); }).then(function(d) {
      document.getElementById('genResult').textContent = d.keys.length + ' key(s) gerada(s): ' + d.keys.join(', ');
      toast(d.keys.length + ' key(s) gerada(s)', 1);
      loadKeys();
    }).catch(function() { toast('Erro ao gerar', 0); });
});

function toggleKey(key) {
  adminFetch('/api/keys/toggle', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({key: key}) })
    .then(function(r) { return r.json(); }).then(function() { loadKeys(); });
}

function deleteKey(key) {
  if (!confirm('Excluir key ' + key + '?')) return;
  adminFetch('/api/keys/delete', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({key: key}) })
    .then(function(r) { return r.json(); }).then(function() { toast('Key excluida', 1); loadKeys(); });
}

function deleteUser(user) {
  if (!confirm('Excluir usuario ' + user + '?')) return;
  adminFetch('/api/admin/delete-user', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({user: user}) })
    .then(function(r) { return r.json(); }).then(function() { toast('Usuario excluido', 1); loadUsers(); });
}
</script>
</body>
</html>
