<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>KABE PRIVATE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#0d0d12;color:#eee;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.box{background:#15151f;border:1px solid #2a1a1a;border-radius:16px;padding:28px;max-width:380px;width:100%;text-align:center}
h1{font-size:24px;color:#ff3344;margin-bottom:6px;font-weight:800}
.sub{font-size:12px;color:#888;margin-bottom:20px}
.key{background:#0d0d12;border:2px solid #ff3344;border-radius:12px;padding:20px;margin:16px 0;cursor:pointer}
.key:active{border-color:#ff6666}
.key .lbl{font-size:10px;text-transform:uppercase;letter-spacing:2px;color:#666;margin-bottom:8px}
.key .val{font-size:22px;font-weight:800;color:#ff3344;font-family:monospace;word-break:break-all;letter-spacing:1px}
.key .hint{font-size:11px;color:#555;margin-top:10px}
.info{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid #1a1a28;margin-top:12px;font-size:12px;color:#666}
.info span:last-child{color:#ff3344;font-weight:600}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#ff3344;color:#fff;padding:10px 24px;border-radius:8px;font-size:14px;font-weight:600;display:none;z-index:99}
</style>
</head>
<body>
<div class="box">
  <h1>KABE PRIVATE</h1>
  <div class="sub">Cole essa key no site para conectar</div>
  <div class="key" onclick="copy()">
    <div class="lbl">Sua Key</div>
    <div class="val">PLACEHOLDER_KEY</div>
    <div class="hint">toque para copiar</div>
  </div>
  <div class="info"><span>IP</span><span>PLACEHOLDER_IP</span></div>
  <div class="info"><span>Servidor</span><span>ok</span></div>
</div>
<div class="toast" id="t"></div>
<script>
function copy(){
  var k='PLACEHOLDER_KEY';
  if(navigator.clipboard){navigator.clipboard.writeText(k).then(function(){show()})}
  else{var t=document.createElement('textarea');t.value=k;document.body.appendChild(t);t.select();document.execCommand('copy');document.body.removeChild(t);show()}
}
function show(){var e=document.getElementById('t');e.textContent='Key copiada!';e.style.display='block';setTimeout(function(){e.style.display='none'},2000)}
</script>
</body>
</html>
